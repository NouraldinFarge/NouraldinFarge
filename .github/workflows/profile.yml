name: Profile README

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint profile documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.18.1 README.md
